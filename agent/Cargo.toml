[package]
name = "aegiron-agent"
default-run = "aegiron-agent"
version = "0.5.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "system_fonts", "clipboard", "x11", "wayland"] }
enigo = "0.6.1"
futures-util = "0.3.34"
getrandom = "0.3"
hkdf = "0.12.4"
hmac = "0.12"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
openh264 = "0.9.9"
# AV1 decoding in the desktop viewer (Rust port of dav1d), without assembly: the x86 code needs
# nasm and the published crate lacks the headers its ARM code includes.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
libc = "0.2"
# QUIC for P2P sessions (UDP hole punching); ring only, like the rest of the TLS stack.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
netdev = { version = "0.47", default-features = false }
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["json", "socks-proxy"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xcap = "0.9.8"
unsafe-libopus = "0.2"

# Tray icon on Windows and macOS (Linux would need GTK).
# Audio playback (and WASAPI loopback capture on Windows) through cpal; on Linux it would need ALSA headers.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"
cpal = "0.18"

# ScreenCaptureKit audio, the VideoToolbox encoder (called through the ObjC runtime / C ABI)
# and aegiron:// links as Apple Events (kAEGetURL) while the app runs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

# Media Foundation hardware H.264 encoder (same `windows` version as cpal).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-core = "0.62"

# rav1e (pure Rust AV1 encoder) is only used by tests and examples/codec_bench.rs: it is too slow
# and buffers too many frames for live sessions (see docs/PROTOCOL.md, Video codecs). Its ARM
# assembly builds with the C compiler openh264 already needs; the x86 one would need nasm.
[dev-dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }

[[bin]]
name = "aegiron-agent"
path = "src/main.rs"

# Desktop app: window with ID/password, approvals, settings and tray icon.
[[bin]]
name = "aegiron"
path = "src/bin/aegiron.rs"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
