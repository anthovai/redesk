[package]
name = "aegiron-agent"
default-run = "aegiron-agent"
version = "0.5.0"
edition = "2024"
description = "Aegiron remote desktop: desktop app and agent"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "system_fonts", "clipboard", "x11", "wayland"] }
enigo = "0.6.1"
futures-util = "0.3.34"
getrandom = "0.3"
hkdf = "0.12.4"
hmac = "0.12"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
openh264 = "0.9.9"
# AV1 decoding in the desktop viewer (Rust port of dav1d), without assembly: the x86 code needs
# nasm and the published crate lacks the headers its ARM code includes.
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8"] }
libc = "0.2"
# QUIC for P2P sessions (UDP hole punching); ring only, like the rest of the TLS stack.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
netdev = { version = "0.47", default-features = false }
rpassword = "7.5.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["json", "socks-proxy"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xcap = "0.9.8"
unsafe-libopus = "0.2"
# Remote terminal sessions: a PTY on the controlled machine (openpty, Windows ConPTY) and a
# small VT parser for the desktop app's terminal window.
portable-pty = "0.9"
vt100 = "0.16"

# Audio playback (and WASAPI loopback capture on Windows) through cpal: ALSA on Linux.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
cpal = "0.18"

# Tray icon on Windows and macOS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

# Linux: tray icon as a StatusNotifierItem over D-Bus (KDE, most desktops; GNOME with the
# AppIndicator extension), no GTK. Wayland capture and input through the XDG desktop portal
# (zbus) with PipeWire video streams: both already come with xcap.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }
zbus = "5.17"
pipewire = "0.10"

# ScreenCaptureKit audio, the VideoToolbox encoder (called through the ObjC runtime / C ABI)
# and aegiron:// links as Apple Events (kAEGetURL) while the app runs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

# Media Foundation hardware H.264 encoder (same `windows` version as cpal), and the input hooks,
# privacy windows and screen lock of the session controls.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

# rav1e (pure Rust AV1 encoder) is only used by tests and examples/codec_bench.rs: it is too slow
# and buffers too many frames for live sessions (see docs/PROTOCOL.md, Video codecs). Its ARM
# assembly builds with the C compiler openh264 already needs; the x86 one would need nasm.
[dev-dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading"] }

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }

[features]
default = ["tray"]
# Tray icon on Linux (always built on Windows and macOS).
tray = ["dep:tray-icon"]

[[bin]]
name = "aegiron-agent"
path = "src/main.rs"

# Desktop app: window with ID/password, approvals, settings and tray icon.
[[bin]]
name = "aegiron"
path = "src/bin/aegiron.rs"

# Linux packages (deploy/linux/build-packages.sh): cargo deb / cargo generate-rpm.
[package.metadata.deb]
name = "aegiron"
maintainer = "Aegiron <aegiron@localhost>"
copyright = "Aegiron"
section = "net"
priority = "optional"
extended-description = """\
Desktop app (aegiron) and command-line agent (aegiron-agent) for Aegiron, a self-hosted \
remote desktop: control this computer from the Aegiron app or a browser, and control others. \
Works on X11 and on Wayland through the XDG desktop portal (PipeWire)."""
# $auto: shared libraries found by dpkg-shlibdeps (PipeWire, ALSA, XCB, GBM, ...). The window
# libraries are loaded with dlopen by winit/glutin, so dpkg cannot see them: listed by hand.
depends = "$auto, xdg-utils, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1, libgl1"
# PulseAudio's client library is loaded at run time (system audio); the portal is needed on
# Wayland; zenity/kdialog ask the local user when only the CLI agent runs.
recommends = "libpulse0, xdg-desktop-portal, pipewire, zenity | kdialog"
assets = [
    ["target/release/aegiron", "usr/bin/", "755"],
    ["target/release/aegiron-agent", "usr/bin/", "755"],
    ["../deploy/linux/aegiron.desktop", "usr/share/applications/", "644"],
    ["assets/aegiron.png", "usr/share/icons/hicolor/256x256/apps/aegiron.png", "644"],
    ["../deploy/linux/aegiron-agent.service", "usr/lib/systemd/user/", "644"],
]

[package.metadata.generate-rpm]
name = "aegiron"
license = "Proprietary"
summary = "Aegiron remote desktop: desktop app and agent"
url = "https://github.com/anthovai/redesk"
assets = [
    { source = "target/release/aegiron", dest = "/usr/bin/aegiron", mode = "755" },
    { source = "target/release/aegiron-agent", dest = "/usr/bin/aegiron-agent", mode = "755" },
    { source = "../deploy/linux/aegiron.desktop", dest = "/usr/share/applications/aegiron.desktop", mode = "644" },
    { source = "assets/aegiron.png", dest = "/usr/share/icons/hicolor/256x256/apps/aegiron.png", mode = "644" },
    { source = "../deploy/linux/aegiron-agent.service", dest = "/usr/lib/systemd/user/aegiron-agent.service", mode = "644" },
]
# Refresh the URL handler (aegiron://) and icon caches; ignored where the tools are missing.
post_install_script = "update-desktop-database -q /usr/share/applications >/dev/null 2>&1 || :; gtk-update-icon-cache -q /usr/share/icons/hicolor >/dev/null 2>&1 || :"
post_uninstall_script = "update-desktop-database -q /usr/share/applications >/dev/null 2>&1 || :"

[package.metadata.generate-rpm.requires]
xdg-utils = "*"
# Loaded with dlopen by winit/glutin (not found by the automatic requirements).
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libX11 = "*"
libX11-xcb = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
libwayland-client = "*"
libwayland-cursor = "*"
libwayland-egl = "*"
libglvnd-egl = "*"
libglvnd-glx = "*"

[package.metadata.generate-rpm.recommends]
"pulseaudio-libs" = "*"
"xdg-desktop-portal" = "*"
"pipewire" = "*"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
