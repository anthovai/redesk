[package]
name = "redesk-agent"
default-run = "redesk-agent"
version = "0.3.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.5"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "default_fonts", "system_fonts", "clipboard", "x11", "wayland"] }
enigo = "0.6.1"
futures-util = "0.3.34"
getrandom = "0.3"
hkdf = "0.12.4"
hostname = "0.4.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "ico"] }
openh264 = "0.9.9"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", features = ["json"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xcap = "0.9.8"

# Tray icon on Windows and macOS (Linux would need GTK).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26.1"

[[bin]]
name = "redesk-agent"
path = "src/main.rs"

# Desktop app: window with ID/password, approvals, settings and tray icon.
[[bin]]
name = "redesk"
path = "src/bin/redesk.rs"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
