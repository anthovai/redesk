name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Headers and tools to build the Linux agent (same list as deploy/linux/Dockerfile).
  LINUX_BUILD_DEPS: >-
    pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libdbus-1-dev
    libegl-dev libgbm-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxkbcommon-dev
    libwayland-dev libx11-dev libxi-dev libxtst-dev libgl-dev rpm

jobs:
  # Agent on real Windows: Media Foundation (software H.264 MFT; hardware MFTs only where a GPU
  # has one), WASAPI loopback + cpal playback on a virtual audio device, the named pipe.
  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      # Hosted runners have no audio endpoint and the Windows Audio service is off; this installs
      # the Scream virtual sound card and starts the service.
      - name: Virtual audio device
        uses: LABSN/sound-ci-helpers@v1
      - run: cargo build --all-targets
      - name: cargo test (including the ignored audio device tests)
        run: cargo test -- --include-ignored --nocapture
        env:
          AEGIRON_REQUIRE_AUDIO: "1"

  agent-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo test

  # Agent and desktop app on Linux, x86_64 and aarch64: build (with and without the tray), then
  # every test including the ignored ones on a headless X server and PulseAudio null sink:
  # real screen capture, XTEST input, clipboard, audio capture and playback.
  agent-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.runner }}
      - name: Build and test dependencies (as in deploy/linux/Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_BUILD_DEPS }} \
            xvfb xauth x11-utils x11-xserver-utils xclip pulseaudio pulseaudio-utils libasound2-plugins
      - run: cargo build --locked --all-targets
      - name: Build without the tray feature
        run: cargo check --locked --bins --no-default-features
      - name: Tests under Xvfb + PulseAudio (deploy/linux/test-x11.sh)
        run: ../deploy/linux/test-x11.sh

  # .deb, .rpm and .tar.gz the way releases are built (deploy/linux/build-packages.sh).
  linux-packages:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: packages-${{ matrix.runner }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_BUILD_DEPS }}
      - run: deploy/linux/build-packages.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages-${{ matrix.runner }}
          path: dist/
          retention-days: 7

  # Installs each package on a clean system: dependencies resolve, libraries load, the
  # aegiron:// handler is registered.
  linux-package-install:
    needs: linux-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, image: "ubuntu:24.04", kind: deb }
          - { runner: ubuntu-24.04-arm, image: "ubuntu:24.04", kind: deb }
          - { runner: ubuntu-24.04, image: "debian:trixie", kind: deb }
          - { runner: ubuntu-24.04, image: "fedora:42", kind: rpm }
          - { runner: ubuntu-24.04-arm, image: "fedora:42", kind: rpm }
          - { runner: ubuntu-24.04, image: "ubuntu:24.04", kind: tar }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: linux-packages-${{ matrix.runner }}
          path: dist
      - name: Install and check
        run: deploy/linux/smoke-test.sh ${{ matrix.kind }} dist

  # The release installer, built the way releases are (cross-compiled with mingw + makensis).
  installer-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 nsis
      - run: deploy/windows/build-installer.sh
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist/
          retention-days: 7

  installer-windows:
    needs: installer-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: windows-installer
          path: dist
      - name: Silent install, checks, single instance, silent uninstall
        shell: pwsh
        run: deploy/windows/smoke-test.ps1 (Get-Item dist/Aegiron-Agent-Setup-*.exe).FullName

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegiron
          POSTGRES_PASSWORD: aegiron
          POSTGRES_DB: aegiron
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegiron"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      AEGIRON_TEST_DATABASE_URL: postgres://aegiron:aegiron@localhost:5432/aegiron?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
