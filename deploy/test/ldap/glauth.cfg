# Test directory for the LDAP sign-in tests (deploy/test/ldap-test.sh). Not for production.
# Passwords (SHA-256 below): svc = Svc-Pass-1!, somchai = Somchai-Pass-1!, malee and
# outsider = Malee-Pass-1!
debug = false

# ldap:// with StartTLS
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"
  tls = true
  tlsCertPath = "/app/config/server.pem"
  tlsKeyPath = "/app/config/server.key"

[ldaps]
  enabled = true
  listen = "0.0.0.0:3894"
  cert = "/app/config/server.pem"
  key = "/app/config/server.key"

[backend]
  datastore = "config"
  baseDN = "dc=aegiron,dc=test"
  nameformat = "cn"
  groupformat = "ou"

[behaviors]
  IgnoreCapabilities = false

